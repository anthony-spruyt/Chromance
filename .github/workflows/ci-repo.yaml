# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# Repo-owned CI jobs; ci.yaml calls this after lint. See https://github.com/anthony-spruyt/repo-operator/blob/main/docs/ci.md

name: "CI (repo)"
on:
  workflow_call: {}
permissions: {}
jobs:
  build:
    name: "PlatformIO Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: "read"
    env:
      # renovate: datasource=pypi depName=platformio
      PLATFORMIO_VERSION: "6.2.0"
      # Placeholders: scripts/inject_secrets.py fails the build unless every credential is set
      WIFI_SSID: "ci"
      WIFI_PASSWORD: "ci"
      OTA_PASSWORD: "ci"
      MQTT_BROKER: "ci"
      MQTT_USERNAME: "ci"
      MQTT_PASSWORD: "ci"
      MQTT_PORT: "1883"
    steps:
      - name: "Harden Runner"
        uses: "anthony-spruyt/repo-operator/.github/actions/harden-runner@2e6b52bfa7578e6b7264be67f2d0c0699c4e07e9" # main
        with:
          allowed-endpoints: >-
            api.github.com:443
            api.registry.platformio.org:443
            dl.registry.nm1.platformio.org:443
            dl.registry.platformio.org:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
          python-version: "3.15"

      - name: "Cache PlatformIO"
        uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: "pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini') }}"

      - name: "Install PlatformIO"
        run: "pip install \"platformio==${PLATFORMIO_VERSION}\""

      - name: "Build firmware"
        run: "pio run -e esp32dev -e esp32dev-usb"
