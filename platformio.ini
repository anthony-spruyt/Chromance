; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/platformio/platform-espressif32.git
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
build_src_flags = -Wall -Wextra
extra_scripts = pre:scripts/inject_secrets.py
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.4.2
  ropg/ezTime@^0.8.3
  https://github.com/FastLED/FastLED.git#3.7.6 ; 3.7.6 was removed from the PlatformIO registry
framework = arduino

; Secrets come from environment variables, see README.md
[esp32dev-ota]
upload_port = ${sysenv.UPLOAD_PORT}
; Only used by espota (esp32rc)
upload_flags =
  --port=3232
  --auth=${sysenv.OTA_PASSWORD}

[env:esp32rc]
extends = esp32dev-ota
upload_protocol = espota
monitor_speed = 115200

; OTA over HTTP (see OTAService::SetupHttpOTA). Works from a dev container, unlike espota.
; $$ leaves OTA_PASSWORD for the shell to expand, so the upload log doesn't print it
[env:esp32dev]
extends = esp32dev-ota
upload_protocol = custom
upload_command = curl --fail --show-error --user "chromance:$$OTA_PASSWORD" --form "firmware=@$SOURCE" http://$UPLOAD_PORT/update ; gitleaks:allow
monitor_speed = 115200

[env:esp32dev-usb]
build_flags =
  -D SERIAL_ENABLED=1
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
build_type = debug
monitor_filters = esp32_exception_decoder
